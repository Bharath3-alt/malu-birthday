<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Look at You Now! 🌷</title>
    <meta name="description" content="A gallery celebrating Malu now, glowing with beauty and charm." />
    <link rel="stylesheet" href="css/style.css?v=20261124-music-controls" />
    <script src="js/script.js?v=20261124-autoplay-music" defer></script>
  </head>
  <body class="page-now">
    <div class="stitch-background" aria-hidden="true">
      <video
        class="stitch-video"
        src="media/characters/stitch-hoverboard.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        poster="media/characters/stitch-hoverboard.svg"
        aria-hidden="true"
      >
        <source src="media/characters/stitch-hoverboard.mp4" type="video/mp4" />
      </video>
    </div>
    <div class="page-shell">
      <header class="topbar">
        <div class="container nav-wrap">
          <a class="brand" href="index.html">Malu ❤️</a>
          <nav class="nav" aria-label="Main navigation">
            <a href="index.html" class="nav-link">Welcome</a>
            <a href="childhood.html" class="nav-link">Childhood</a>
            <a href="now.html" class="nav-link active">Now</a>
            <a href="us.html" class="nav-link">Us</a>
            <a href="birthday.html" class="nav-link">Birthday</a>
          </nav>
        </div>
      </header>

      <main class="container page-main">
        <section class="page-intro reveal fade-in-up">
          <p class="eyebrow">Still glowing</p>
          <h1>Look at You Now! 🌷</h1>
          <p class="subtitle">How did one person manage to become this beautiful?</p>
        </section>

        <section class="now-gallery reveal fade-in-up" aria-label="Current photos of Malu">
          <div class="polaroid-grid">
            <figure class="polaroid-card lightbox-trigger" data-image="media/now/now-1.svg" data-caption="Beautiful, kind, and stunning in every way.">
              <img src="media/now/now-1.svg" alt="Malu portrait in a dreamy close-up" />
              <figcaption>Radiant smile ✨</figcaption>
            </figure>
            <figure class="polaroid-card lightbox-trigger" data-image="media/now/now-2.svg" data-caption="The kind of beauty that feels warm and comforting.">
              <img src="media/now/now-2.svg" alt="Malu portrait in soft pink tones" />
              <figcaption>Soft sparkle 🌷</figcaption>
            </figure>
            <figure class="polaroid-card lightbox-trigger" data-image="media/now/now-3.svg" data-caption="Grace, charm, and that unforgettable glow.">
              <img src="media/now/now-3.svg" alt="Malu in a romantic portrait" />
              <figcaption>Pure elegance 💗</figcaption>
            </figure>
            <figure class="polaroid-card lightbox-trigger" data-image="media/now/now-4.svg" data-caption="A perfect reminder that you are so loved.">
              <img src="media/now/now-4.svg" alt="Malu portrait with dreamy colors" />
              <figcaption>My favorite view 🫶</figcaption>
            </figure>
          </div>
        </section>

        <div class="page-actions reveal fade-in-up">
          <a class="button primary" href="us.html">Our memories together 💗</a>
        </div>
      </main>
    </div>

    <div id="lightbox" class="lightbox" aria-hidden="true">
      <button class="lightbox-close" type="button" aria-label="Close image viewer">×</button>
      <img id="lightbox-image" src="" alt="Expanded Malu photo" />
      <p id="lightbox-caption"></p>
    </div>

    <div class="site-music-player" role="group" aria-label="Background music player">
      <div class="site-music-info">
        <span class="site-music-eyebrow">BACKGROUND MUSIC</span>
        <span class="site-music-title">Until I Found You</span>
      </div>
      <button class="site-music-button site-play-button" id="site-music-play" type="button" aria-label="Play music" title="Play music" aria-pressed="false">
        <span aria-hidden="true">▶</span>
      </button>
      <button class="site-music-button site-mute-button" id="site-music-mute" type="button" aria-label="Mute music" title="Mute music" aria-pressed="false">
        <span aria-hidden="true">🔊</span>
      </button>
      <audio id="site-background-music" autoplay loop preload="auto" aria-label="Until I Found You background music">
        <source src="media/music/until-i-found-you.mp3" type="audio/mpeg" />
      </audio>
      <span class="site-music-status" id="site-music-status" aria-live="polite"></span>
    </div>
  </body>
</html>
